<svg xmlns="http://www.w3.org/2000/svg" width="820" height="740" viewBox="0 0 820 740"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#52677c"/></marker></defs><g font-family="Arial,sans-serif" font-size="15" fill="#15324d"><text x="80" y="30" font-size="22" font-weight="bold">Flujo del código base</text><rect x="80" y="52" width="660" height="54" rx="9" fill="#eef4f8" stroke="#6c8da5"/><text x="410" y="84" text-anchor="middle">Inicio: dos jugadores y hojas vacías</text><line x1="410" y1="106" x2="410" y2="128" stroke="#52677c" marker-end="url(#arrow)"/><rect x="80" y="131" width="660" height="54" rx="9" fill="#eef4f8" stroke="#6c8da5"/><text x="410" y="163" text-anchor="middle">Tirada inicial de cinco dados</text><line x1="410" y1="185" x2="410" y2="207" stroke="#52677c" marker-end="url(#arrow)"/><rect x="80" y="210" width="660" height="54" rx="9" fill="#eef4f8" stroke="#6c8da5"/><text x="410" y="242" text-anchor="middle">¿Quedan repeticiones? Si no, anotar</text><line x1="410" y1="264" x2="410" y2="286" stroke="#52677c" marker-end="url(#arrow)"/><rect x="80" y="289" width="660" height="54" rx="9" fill="#eef4f8" stroke="#6c8da5"/><text x="410" y="321" text-anchor="middle">Evaluar 32 máscaras con Montecarlo</text><line x1="410" y1="343" x2="410" y2="365" stroke="#52677c" marker-end="url(#arrow)"/><rect x="80" y="368" width="660" height="54" rx="9" fill="#eef4f8" stroke="#6c8da5"/><text x="410" y="400" text-anchor="middle">Conservar máscara de mayor valor esperado</text><line x1="410" y1="422" x2="410" y2="444" stroke="#52677c" marker-end="url(#arrow)"/><rect x="80" y="447" width="660" height="54" rx="9" fill="#eef4f8" stroke="#6c8da5"/><text x="410" y="479" text-anchor="middle">¿Conservar todos? Sí: anotar y cerrar turno</text><line x1="410" y1="501" x2="410" y2="523" stroke="#52677c" marker-end="url(#arrow)"/><rect x="80" y="526" width="660" height="54" rx="9" fill="#eef4f8" stroke="#6c8da5"/><text x="410" y="558" text-anchor="middle">Lanzar libres y volver a evaluar</text><line x1="410" y1="580" x2="410" y2="602" stroke="#52677c" marker-end="url(#arrow)"/><rect x="80" y="605" width="660" height="54" rx="9" fill="#eef4f8" stroke="#6c8da5"/><text x="410" y="637" text-anchor="middle">Anotar categoría y avanzar jugador (26 turnos)</text><text x="80" y="715" font-size="12">Las decisiones de repetir vuelven a la evaluación hasta agotar tiradas o plantarse.</text></g></svg>